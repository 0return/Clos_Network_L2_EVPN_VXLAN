name: Lab_L2_EVPN
topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:25.7
  nodes:
    spine1:
      kind: nokia_srlinux
      type: ixr-d3
    spine2:
      kind: nokia_srlinux
      type: ixr-d3
    leaf1:
      kind: nokia_srlinux
      type: ixr-d3
    leaf2:
      kind: nokia_srlinux
      type: ixr-d3
    leaf3:
      kind: nokia_srlinux
      type: ixr-d3
    client1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
    client2:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
    client3:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
    client4:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
    client5:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
    client6:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest

  links:
    # Spine1´s connections
    - endpoints: [ "spine1:e1-1", "leaf1:e1-1" ]
    - endpoints: [ "spine1:e1-2", "leaf2:e1-1" ]
    - endpoints: [ "spine1:e1-3", "leaf3:e1-1" ]

    # Spine2´s connections
    - endpoints: [ "spine2:e1-1", "leaf1:e1-2" ]
    - endpoints: [ "spine2:e1-2", "leaf2:e1-2" ]
    - endpoints: [ "spine2:e1-3", "leaf3:e1-2" ]

    # Client´s connections
    - endpoints: [ "client1:eth1", "leaf1:e1-3" ]
    - endpoints: [ "client2:eth1", "leaf2:e1-3" ]
    - endpoints: [ "client3:eth1", "leaf3:e1-3" ]
    
    - endpoints: [ "client6:eth1", "leaf1:e1-4" ]
    - endpoints: [ "client5:eth1", "leaf2:e1-4" ]
    - endpoints: [ "client4:eth1", "leaf3:e1-4" ]

